  <style
     id="style1">
    :root { --route-color:#e85d75; }
    .ocean{fill:#FAFAF8} .land{fill:#D4DADC} .route{stroke:url(#route-gradient)} .arrow{fill:#000000}
  </style>
  <g clip-path="url(#map-frame)">
  <rect
     class="ocean"
     width="100"
     height="100"
     id="rect1" />
