     d="m 0,0 h 59.539604 c -4.669773,8 2.334886,13 -4.669773,19 -5.837216,5 1.167443,10 -5.837216,15 -5.837216,5 1.167443,10 -8.172102,14 -7.00466,4 -1.167444,9 -9.339546,13 C 24.516308,65 29.18608,72 21.013978,77 15.176762,81 16.344205,88 9.3395457,92 L 0,94 Z"
     id="path1"
     style="stroke-width:1.08048" />
  <!-- small irregular island and its origin -->
  <path
     class="land"
     d="m 77.774914,53.348656 c 7.360265,-5.322769 12.583853,-0.236443 11.404286,8.372505 4.414784,2.347271 5.001129,11.89513 -1.550332,19.956953 -0.296611,9.078403 -9.496943,15.731865 -12.954617,11.584447 -7.360265,5.322769 -9.786678,-2.894396 -10.521329,-7.903052 -4.414784,-2.347271 -3.235216,-10.95622 3.242092,-16.748443 1.179568,-8.608948 5.81681,-13.07048 10.3799,-15.26241 z"
     id="path2"
     style="stroke-width:1.42785" />
  <circle
     cx="80"
     cy="69"
     r="2.2"
     class="arrow"
     stroke="none"
     id="circle4-0"
     style="fill:#000000" />
  <!-- one arc, one simple arrow -->
